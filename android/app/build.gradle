plugins {
  id 'com.android.application'
}

android {
  namespace 'com.elixium.client'
  compileSdk 34

  defaultConfig {
    applicationId "com.elixium.client"
    minSdk 24
    targetSdk 34
    versionCode 1
    versionName "1.4.0"
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

/*
 * Kotlin folded the jdk7 and jdk8 standard libraries into kotlin-stdlib at
 * 1.8, but older transitive dependencies still ask for them by name. Both then
 * arrive carrying the same classes, and dex merging refuses the duplicates.
 * Dropping the legacy artifacts leaves one copy, which is what they resolve to
 * anyway.
 */
configurations.configureEach {
  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
  implementation 'androidx.appcompat:appcompat:1.7.0'
  implementation 'androidx.core:core:1.13.1'
}
